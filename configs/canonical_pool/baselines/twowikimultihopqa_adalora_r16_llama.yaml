dataset:
  name: twowikimultihopqa
evaluation:
  do_sample: false
  max_new_tokens: 32
  num_beams: 4
  temperature: 0.0
hardware:
  device: cuda
  mixed_precision: true
logging:
  log_every_n_steps: 50
  save_every_n_epochs: 1
lora:
  alpha: 32
  deltaT: 10
  dropout: 0.05
  init_r: 24
  method: adalora
  rank: 16
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - up_proj
  - down_proj
  tfinal: 3500
  tinit: 200
  total_step: 5000
lora_pool_path: data/preprocessed_10k/twowikimultihopqa_canonical_n10000.json
method: adalora
model:
  base_model: meta-llama/Llama-3.1-8B
  torch_dtype: bfloat16
output_root: outputs/canonical_pool_2026_05_09
training:
  batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 0.0002
  max_grad_norm: 1.0
  max_seq_length: 2048
  max_train_samples: 10000
  num_epochs: 2
  warmup_steps: 100
  weight_decay: 0.0
