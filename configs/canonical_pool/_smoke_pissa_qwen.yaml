dataset:
  name: musique
evaluation:
  do_sample: false
  max_new_tokens: 32
  num_beams: 4
  temperature: 0.0
hardware:
  device: cuda
  mixed_precision: true
logging:
  log_every_n_steps: 2
  save_every_n_epochs: 1
method: lora
lora:
  alpha: 32
  dropout: 0.0
  rank: 16
  init_lora_weights: pissa_niter_4
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - up_proj
  - down_proj
lora_pool_path: data/preprocessed_10k/_smoke_musique_n40.json
model:
  base_model: Qwen/Qwen2.5-7B
  torch_dtype: bfloat16
output_root: outputs/_smoke
training:
  batch_size: 2
  gradient_accumulation_steps: 2
  learning_rate: 0.0002
  max_grad_norm: 1.0
  max_seq_length: 4096
  max_train_samples: 40
  num_epochs: 1
  warmup_steps: 2
  weight_decay: 0.0
